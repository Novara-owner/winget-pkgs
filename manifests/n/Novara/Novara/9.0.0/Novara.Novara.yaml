ShortDescription: Local-first personal data control layer - memos, paths, plans and records with optional AES-256-GCM encryption, an MCP agent interface and self-hosted end-to-end-encrypted sync.
Description: Novara is a local-first personal data control layer for you and your AI agents. All data lives in a single encrypted database on your machine (no cloud, no telemetry, no account), protected by optional AES-256-GCM authenticated encryption with a privacy lock, Windows Hello unlock and auto-lock. It ships a local MCP server (14 tools with a fine-grained permission matrix) so AI agents can read and write data under your control, exports encrypted self-contained HTML snapshots readable anywhere, and since 8.0 synchronizes across your devices through a self-hosted server that only ever handles ciphertext, and 9.0 ships that server as an official container image with one-command compose deployment.
